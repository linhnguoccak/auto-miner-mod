name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Gradle 9.5.0
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.5.0-bin.zip -O gradle.zip
          unzip -q gradle.zip -d $HOME/gradle-dist
          echo "$HOME/gradle-dist/gradle-9.5.0/bin" >> $GITHUB_PATH

      - name: Build
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: auto-miner-jar
          path: build/libs/*.jar
